# ===== 短链接服务一键编排：Nginx + Django(gunicorn) + MySQL + Redis =====
services:
  db:
    image: mysql:8.0
    container_name: shorturl-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shorturl}
      MYSQL_USER: ${DB_USER:-shorturl}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shorturl_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root_pass}"]
      interval: 6s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: shorturl-cache
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 6s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    container_name: shorturl-web
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-please-change-this-secret-in-production}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-shorturl}
      DB_USER: ${DB_USER:-shorturl}
      DB_PASSWORD: ${DB_PASSWORD:-shorturl_pass}
      REDIS_URL: redis://cache:6379/0
      SITE_BASE_URL: http://localhost:${HTTP_PORT:-8088}
      ALLOW_ANONYMOUS_CREATE: "True"
      GUNICORN_WORKERS: "3"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: shorturl-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/usr/share/nginx/static:ro
    ports:
      - "${HTTP_PORT:-8088}:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  static_data:
